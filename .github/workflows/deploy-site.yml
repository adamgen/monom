name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # monom.dev/install.sh is copied from here at build time.
      - "install.sh"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one, never cancels it midway.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy to monom.dev
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://monom.dev
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: node scripts/prerender.mjs

      - name: wrangler deploy
        run: npx --yes wrangler@4.143.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
