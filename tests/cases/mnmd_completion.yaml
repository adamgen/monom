# `mnmd <Tab>` completes mnmd's own subcommands, and nothing after them.

root: fixtures/demo-project
shells: [bash, zsh]

cases:
  - name: empty line offers every subcommand
    input: "mnmd "
    action: tab
    expect: [filter, root, pack, discover, check, install, completion]

  - name: prefix narrows the subcommands
    input: mnmd fi
    action: tab
    expect: [filter]

  - name: nothing is completed beyond the subcommand slot
    input: "mnmd filter "
    action: tab
    expect: []
