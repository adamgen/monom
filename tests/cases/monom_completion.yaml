# `monom <Tab>` through the real completion bindings.
# The demo project's `complete` hook lists every executable under it:
#   db/migrate db/seed infra/cloud/deploy infra/cloud/teardown
#   infra/local/start infra/local/stop release

root: fixtures/demo-project
shells: [bash, zsh]

cases:
  - name: empty line offers top-level commands and groups
    input: "monom "
    action: tab
    expect: [db, infra, release]

  - name: partial word narrows the top level
    input: monom in
    action: tab
    expect: [infra]

  - name: complete word without a trailing space completes the word itself, not its children
    input: monom infra
    action: tab
    expect: [infra]

  - name: trailing space drills into a group
    input: "monom infra "
    action: tab
    expect: [cloud, local]

  - name: trailing space drills into a nested group
    input: "monom infra cloud "
    action: tab
    expect: [deploy, teardown]

  - name: partial word inside a nested group
    input: monom infra cloud de
    action: tab
    expect: [deploy]

  - name: nothing is offered past a leaf command
    input: "monom release "
    action: tab
    expect: []

  - name: unknown prefix offers nothing
    input: monom zzz
    action: tab
    expect: []
