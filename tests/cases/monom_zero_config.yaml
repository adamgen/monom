# Zero-config projects through the shell surface: with no monom file, an
# empty one, or a hook script whose `complete` prints nothing, the command
# tree comes from `mnmd discover`, and Tab, group listings and execution all
# see the same registered set. Fixtures: see tests/cases/mnmd_discover.yaml.

# fixtures/zero-config-project has no monom file, so its groups pin the root
# with _MONOM_PROJECT_ROOT, the way an alias would. The variants have a monom
# file, and their root resolves from it.
shells: [bash, zsh]

groups:
  - name: no monom file
    root: fixtures/zero-config-project
    env:
      _MONOM_PROJECT_ROOT: "{root}"
    cases:
      # tab: the gate decides what is offered
      - name: tab offers the discovered top level and nothing that fails the gate
        input: "monom "
        action: tab
        expect: [build, deploy, scripts]

      - name: tab drills into a discovered group
        input: "monom build "
        action: tab
        expect: [compile]

      - name: a shebang admits any name, offered without its suffix
        input: "monom scripts "
        action: tab
        expect: [setup]

      - name: an ungated executable is not offered
        input: monom notes
        action: tab
        expect: []

      - name: private, hidden and dependency directories are not offered
        input: monom _
        action: tab
        expect: []

      - name: dependency directories are not offered
        input: monom node
        action: tab
        expect: []

      # enter
      - name: a shebang command runs without a monom file
        input: monom deploy
        action: enter
        expect: deploying...

      - name: a shebangless command with a command-like name runs
        input: monom build compile
        action: enter
        expect: compiling...

      - name: no arguments lists the discovered top level
        input: monom
        action: enter
        exit: 1
        expect: |
          monom: monom
          available: build, deploy, scripts

      - name: a discovered group lists its children
        input: monom build
        action: enter
        exit: 1
        expect: |
          monom: 'build' is a command group
          available: compile

      # keys: real Tab presses
      - name: keys complete a discovered command
        input: monom de
        action: keys
        tabs: 1
        line: "monom deploy "
        candidates: []

      - name: keys complete the only child of a discovered group
        input: "monom build "
        action: keys
        tabs: 1
        line: "monom build compile "

      - name: keys complete nothing for an ungated executable
        input: monom no
        action: keys
        tabs: 2
        line: monom no
        candidates: []

  - name: bash listing
    shells: [bash]
    root: fixtures/zero-config-project
    env:
      _MONOM_PROJECT_ROOT: "{root}"
    cases:
      - name: bash second tab lists the discovered top level
        input: "monom "
        action: keys
        tabs: 2
        line: "monom "
        candidates: [build, deploy, scripts]

  - name: zsh listing and menu
    shells: [zsh]
    root: fixtures/zero-config-project
    env:
      _MONOM_PROJECT_ROOT: "{root}"
    cases:
      - name: zsh first tab lists the discovered top level
        input: "monom "
        action: keys
        tabs: 1
        line: "monom "
        candidates: [build, deploy, scripts]

      - name: zsh second tab inserts the first discovered command
        input: "monom "
        action: keys
        tabs: 2
        line: monom build
        candidates: [build, deploy, scripts]

  - name: empty monom file
    root: fixtures/zero-config-variants/empty-monom
    cases:
      - name: with an empty monom file tab offers discovered commands
        input: "monom "
        action: tab
        expect: [build, deploy]

      - name: with an empty monom file a discovered command runs
        input: monom deploy
        action: enter
        expect: deploying...

  - name: complete hook
    root: fixtures/zero-config-variants/hook-complete
    cases:
      - name: a complete hook that prints paths replaces discovery
        input: "monom "
        action: tab
        expect: [deploy]

  - name: hook without complete
    root: fixtures/zero-config-variants/hook-config-strict
    cases:
      - name: a hook script whose complete prints nothing falls back to discovery
        input: "monom "
        action: tab
        expect: [deploy]

  - name: declarative monom file that is executable
    root: fixtures/zero-config-variants/declarative-exec
    cases:
      - name: an executable monom file without a shebang is never run
        # its only line is `echo EXECUTED`; running it would print that
        input: monom deploy
        action: enter
        expect: deploying...

      - name: an executable monom file without a shebang is never run for completion
        input: "monom "
        action: tab
        expect: [deploy]

  - name: discover.hide in the monom file
    root: fixtures/zero-config-variants/discover-hide
    env:
      _MONOM_PROJECT_ROOT: "{root}"
    cases:
      - name: tab does not offer a hidden name or directory
        input: "monom "
        action: tab
        expect: [deploy, other, tools]

      - name: tab offers a declared entry even when a hide pattern matches it
        input: "monom tools "
        action: tab
        expect: [build, wip-keep]

      - name: a directory whose contents are all hidden is not offered
        input: "monom lib"
        action: tab
        expect: []

      - name: a declared entry that matches a hide pattern runs
        input: monom tools wip-keep
        action: enter
        expect: keeping...

  - name: discover.hide from a config hook
    root: fixtures/zero-config-variants/hook-discover-hide
    env:
      _MONOM_PROJECT_ROOT: "{root}"
    cases:
      - name: tab does not offer entries a config hook hides
        input: "monom "
        action: tab
        expect: [deploy]

  - name: suffix stripping
    root: fixtures/zero-config-variants/suffix
    cases:
      # tab: stripped names are what completion offers
      - name: tab offers stripped command names
        input: "monom "
        action: tab
        expect: [build.py, build.sh, db, db.sh, deploy, pkg.tar, release, release.sh, tools]

      - name: tab offers a stripped name inside a group
        input: "monom tools "
        action: tab
        expect: [lint]

      - name: tab completes a prefix to the stripped name
        input: monom dep
        action: tab
        expect: [deploy]

      # enter: the stripped name runs the suffixed file
      - name: a stripped command name runs its suffixed file
        input: monom deploy
        action: enter
        expect: ran deploy.sh

      - name: a stripped command name runs inside a group
        input: monom tools lint
        action: enter
        expect: ran tools/lint.bash

      - name: the full file name still runs
        input: monom deploy.sh
        action: enter
        expect: ran deploy.sh

      - name: only the last suffix is stripped
        input: monom pkg.tar
        action: enter
        expect: ran pkg.tar.gz

      - name: an existing extensionless file wins over a suffixed one
        input: monom release; monom release.sh
        action: enter
        expect: |
          ran release
          ran release.sh

      - name: a directory wins over a suffixed file with the same stem
        input: monom db
        action: enter
        exit: 1
        expect: |
          monom: 'db' is a command group
          available: migrate

      - name: a group lists its children by their stripped names
        input: monom tools
        action: enter
        exit: 1
        expect: |
          monom: 'tools' is a command group
          available: lint

      - name: a stem shared by two executables is ambiguous and runs nothing
        input: monom build
        action: enter
        exit: 1
        expect: "mnmd pack: pack: ambiguous command build: matches build.py, build.sh"

      - name: each of two files sharing a stem runs by its full name
        input: monom build.py; monom build.sh
        action: enter
        expect: |
          ran build.py
          ran build.sh

      # keys: real Tab presses
      - name: keys complete a stripped command name
        input: monom dep
        action: keys
        tabs: 1
        line: "monom deploy "
        candidates: []

      - name: keys complete the stripped name of a group's only child
        input: "monom tools "
        action: keys
        tabs: 1
        line: "monom tools lint "

  - name: suffix stripping off
    root: fixtures/zero-config-variants/suffix-off
    cases:
      - name: with strip-suffix off tab offers full file names
        input: "monom tools "
        action: tab
        expect: [lint.bash]

      - name: with strip-suffix off the full file name runs
        input: monom tools lint.bash
        action: enter
        expect: ran tools/lint.bash

      - name: with strip-suffix off the stem still runs, like any unregistered path
        # pack does not read the config; strip-suffix only decides what is offered
        input: monom deploy
        action: enter
        expect: ran deploy.sh
