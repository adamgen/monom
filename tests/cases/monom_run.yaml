# `monom <command...><Enter>`: resolve the tokens to a file and run it.
# Multi-token commands must survive as separate words in both shells (zsh does
# not word-split unquoted parameters), so every case runs in bash and zsh.

root: fixtures/demo-project
shells: [bash, zsh]

cases:
  - name: single-token command runs
    input: monom release
    action: enter
    expect: releasing...

  - name: two-token command runs the nested file
    input: monom db migrate
    action: enter
    expect: running db migrations...

  - name: three-token command runs the deeply nested file
    input: monom infra cloud deploy
    action: enter
    expect: deploying to cloud...

  - name: a group lists its children instead of running anything
    input: monom infra
    action: enter
    exit: 1
    expect: |
      monom: 'infra' is a command group
      available: cloud, local

  - name: a nested group is named by the last typed token
    input: monom infra cloud
    action: enter
    exit: 1
    expect: |
      monom: 'cloud' is a command group
      available: deploy, teardown

  - name: no arguments lists the top-level commands
    input: monom
    action: enter
    exit: 1
    expect: |
      monom: monom
      available: db, infra, release

groups:
  # fixtures/hooks-project: `run` aliases `dbm` to `db migrate` and fails for
  # `explode`; `empty/` is a group with no commands.
  - name: hooks
    root: fixtures/hooks-project
    cases:
      - name: run hook expands an alias into multiple tokens
        input: monom dbm
        action: enter
        expect: ran db/migrate

      - name: failing run hook surfaces its error and never falls back to the literal command
        input: monom explode
        action: enter
        exit: 3
        expect: |
          monom: run hook failed (exit 3)
          run hook: boom

      - name: an empty group is reported without an available list
        input: monom empty
        action: enter
        exit: 1
        expect: "monom: 'empty' is a command group"

      - name: tab offers exactly what the complete hook lists
        input: "monom "
        action: tab
        expect: [db, explode, release]
